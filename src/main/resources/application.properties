# Attendify Application Configuration
spring.application.name=attendify
server.port=8080

# Database Configuration (H2 file-based persistence for immediate zero-config execution; switchable to PostgreSQL)
spring.datasource.url=jdbc:h2:file:./data/attendifydb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & JWT Configuration
attendify.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
attendify.jwt.expiration-ms=86400000

# OTP Settings
attendify.otp.expiration-minutes=5
attendify.otp.max-resend-count=5
attendify.otp.dev-mode=true

# Twilio SMS Configuration (Optional - will simulate and log if not provided)
attendify.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
attendify.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
attendify.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# Default Attendance Rules
attendify.rules.minimum-attendance-percentage=75.0
attendify.rules.late-multiplier=1.0
attendify.rules.correction-window-hours=48
attendify.rules.auto-notify-parents=true
